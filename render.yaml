services:
  # Backend Web Service
  - type: web
    name: mediscan-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python seed_demo_data.py
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true

  # Frontend Static Site
  - type: web
    name: mediscan-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
